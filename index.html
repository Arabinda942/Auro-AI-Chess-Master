<script>
const $=id=>document.getElementById(id);
const V={P:100,N:320,B:330,R:500,Q:900,K:0},FL='abcdefgh',nm=i=>FL[i&7]+(8-(i>>3));

 return out}
function make(s,m){const b=s.b.slice(),p=b[m.f],t=s.t;let c=s.c,ep=-1;const cap=b[m.t];
 b[m.t]=m.p?t+m.p:p;b[m.f]=null;if(m.e)b[m.t+(t=='w'?8:-8)]=null;
 if(m.k){if(m.t>m.f){b[m.f+1]=b[m.f+3];b[m.f+3]=null}else{b[m.f-1]=b[m.f-4];b[m.f-4]=null}}
 if(p[1]=='P'&&Math.abs(m.t-m.f)==16)ep=(m.f+m.t)/2;
 const rm=x=>{c=c.replace(x,'')};if(p[1]=='K'){if(t=='w'){rm('K');rm('Q')}else{rm('k');rm('q')}}
 for(const q of[m.f,m.t]){if(q==63)rm('K');if(q==56)rm('Q');if(q==7)rm('k');if(q==0)rm('q')}

const inChk=s=>att(s.b,s.b.indexOf(s.t+'K'),s.t=='w'?'b':'w');

function ev(s){const b=s.b,F=[[],[]];for(let c=0;c<8;c++){F[0].push([]);F[1].push([])}let nmat=0;
 for(let i=0;i<64;i++){const p=b[i];if(!p)continue;if(p[1]=='P')F[p[0]=='w'?0:1][i&7].push(i>>3);else if(p[1]!='K')nmat+=V[p[1]]}
 const eg=nmat<2600;let v=s.t=='w'?10:-10,bw=0,bb=0;
 for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const w=p[0]=='w',ty=p[1],R0=i>>3,r=w?R0:7-R0,c=i&7,my=F[w?0:1],op=F[w?1:0];

   let ps=1;for(let k=Math.max(0,c-1);k<=Math.min(7,c+1);k++)for(const rr of op[k])if(w?rr<R0:rr>R0)ps=0;
   if(ps)x+=a*a*5+a*6}

  else if(ty=='R'){x+=r==1?14:0;if(!my[c].length)x+=op[c].length?8:16}
  else if(ty=='Q')x+=cen;
  else{if(eg)x+=cen*9;else{x+=(r==7?8:-25)+(r==7&&(c<3||c>5)?18:0);let sh=0;for(let k=Math.max(0,c-1);k<=Math.min(7,c+1);k++)for(const rr of my[k])if((w?rr:7-rr)>=5)sh++;x+=sh*9}}
  v+=w?x:-x}

const order=(ms,s)=>{const sc=m=>(s.b[m.t]?10*V[s.b[m.t][1]]-V[s.b[m.f][1]]/10:0)+(m.e?900:0)+(m.p?(m.p=='Q'?800:0):0);return ms.map(m=>[sc(m),m]).sort((a,b)=>b[0]-a[0]).map(x=>x[1])};
let DL=0,ABORT=0,NC=0,KL=[],TT=new Map(),HS=new Int32Array(4096);
function srch(s,d,a,b,pl,nul){if(DL&&(++NC&255)==0&&Date.now()>DL)ABORT=1;if(ABORT)return 0;if(s.hm>=100)return 0;
 const me=s.t,inC=inChk(s);if(inC&&d>0&&pl<40)d++;const q=d<=0,a0=a;let bs=-1e9,ms=gen(s),e=null,key;
 if(q){const st=(me=='w'?1:-1)*ev(s);if(d<-4||st>=b)return st;bs=st;if(st>a)a=st;ms=ms.filter(m=>s.b[m.t]||m.e||m.p)}
 else{key=s.b.join()+me+s.c+s.ep;e=TT.get(key);
  if(e&&e.d>=d&&pl>0&&(e.f==0||(e.f==1&&e.v>=b)||(e.f==2&&e.v<=a)))return e.v;
  if(nul&&!inC&&d>=3&&s.b.some(p=>p&&p[0]==me&&p[1]!='P'&&p[1]!='K')){const v=-srch({b:s.b,t:me=='w'?'b':'w',c:s.c,ep:-1,hm:s.hm+1},d-3,-b,-b+1,pl+1,0);if(ABORT)return 0;if(v>=b)return b}}
 const hm=e&&e.m,kl=KL[pl]||[];
 const sc=m=>{if(hm&&m.f==hm.f&&m.t==hm.t&&m.p==hm.p)return 1e7;const g=s.b[m.t];if(g||m.e)return 1e5+10*V[g?g[1]:'P']-V[s.b[m.f][1]]/10;if(m.p)return 9e4;const k=m.f*64+m.t;return k==kl[0]?5e4:k==kl[1]?4e4:HS[k]};

 let n=0,bm=null;
 for(const m of ms){const c=make(s,m);if(att(c.b,c.b.indexOf(me+'K'),c.t))continue;n++;
  const cap=s.b[m.t]||m.e||m.p;let v;
  if(q||n==1)v=-srch(c,d-1,-b,-a,pl+1,1);
  else{const r=(d>=3&&n>4&&!cap&&!inC)?(n>10?2:1):0;
   v=-srch(c,d-1-r,-a-1,-a,pl+1,1);if(v>a&&r)v=-srch(c,d-1,-a-1,-a,pl+1,1);if(v>a&&v<b)v=-srch(c,d-1,-b,-a,pl+1,1)}

 return bs}
function bestPro(s,L){KL=[];HS.fill(0);NC=0;ABORT=0;DL=0;const ms=order(legal(s),s);let bm=ms[0];const t0=Date.now();

  for(const m of ms){const c=make(s,m);let v;
   if(!cur)v=-srch(c,dd-1,-1e9,1e9,1,1);else{v=-srch(c,dd-1,-a-1,-a,1,1);if(v>a)v=-srch(c,dd-1,-1e9,-a,1,1)}

  if(ABORT)break;bm=cur;ms.splice(ms.indexOf(cur),1);ms.unshift(cur);if(Math.abs(a)>20000||Date.now()-t0>L.t*.6)break}

function best(s,d,nz){let bm=null;const ms0=order(legal(s),s);

const uci=m=>nm(m.f)+nm(m.t)+(m.p?m.p.toLowerCase():'');

   o+=(cap?'x':'')+nm(m.t)}}

let G=null,sel=null,flip=false,busy=false,targets=[];
function newGame(){const pn=$('pname').value.trim();if(!pn){$('status').textContent='Please enter your name first';$('pname').focus();return}

 busy=false;G={s,states:[s],san:[],uci:[],human:c,lvl:+$('lvl').value,over:null,last:null,name:pn,tc:tm>0,clk:{w:tm*1000,b:tm*1000},inc,tick:Date.now(),tcl:tm>0?$('tc').selectedOptions[0].text:'No clock'};
 flip=c=='b';sel=null;render();aiTurn()}
function play(m){if(G.over||!spend())return;const s=G.s,ms=legal(s),mm=ms.find(x=>x.f==m.f&&x.t==m.t&&x.p==m.p);G.san.push(san(s,mm,ms));G.uci.push(uci(mm));
 G.s=make(s,mm);G.states.push(G.s);G.last=mm;sel=null;endCheck();render();if(!G.over)aiTurn()}
function endCheck(){const s=G.s,ms=legal(s);let r=null,why='';
 if(!ms.length){if(inChk(s)){r=s.t=='w'?'0-1':'1-0';why='Checkmate'}else{r='1/2-1/2';why='Stalemate'}}
 else if(s.hm>=100){r='1/2-1/2';why='Fifty-move rule'}
 else{const key=x=>x.b.join()+x.t+x.c+x.ep;if(G.states.filter(x=>key(x)==key(s)).length>=3){r='1/2-1/2';why='Threefold repetition'}
  else{const pc=s.b.filter(x=>x&&x[1]!='K');if(!pc.length||(pc.length==1&&'NB'.includes(pc[0][1]))){r='1/2-1/2';why='Insufficient material'}}}
 if(r){G.over={r,why};save()}}
function aiTurn(){if(G.over||G.s.t==G.human)return;busy=true;render();
 const g=G;setTimeout(()=>{if(G!==g)return;const ms=legal(G.s),bk=BK[G.uci.join(' ')],cand=bk&&ms.filter(m=>bk.includes(uci(m)));
  const L=LV[G.lvl];const m=cand&&cand.length?cand[Math.random()*cand.length|0]:L.pro?bestPro(G.s,L):best(G.s,L.d,L.nz);busy=false;play(m)},80)}
function click(i){if(!G||busy||G.over||G.s.t!=G.human)return;const p=G.s.b[i];
 if(sel!=null){const m=legal(G.s).find(x=>x.f==sel&&x.t==i&&(!x.p||x.p=='Q'));if(m){play(m);return}}
 sel=p&&p[0]==G.human?i:null;render()}
function render(){const B=$('board');B.innerHTML='';if(!G){for(let d=0;d<64;d++){const e=document.createElement('div');e.className='sq '+(((d>>3)+(d&7))%2?'d':'l');B.appendChild(e)}drawBars();return}
 const ms=legal(G.s);targets=sel!=null?ms.filter(m=>m.f==sel).map(m=>m.t):[];const ks=inChk(G.s)?G.s.b.indexOf(G.s.t+'K'):-1;
 for(let d=0;d<64;d++){const i=flip?63-d:d,p=G.s.b[i],e=document.createElement('div');
  let c='sq '+(((i>>3)+(i&7))%2?'d':'l');if(G.last&&(i==G.last.f||i==G.last.t))c+=' last';if(i==sel)c+=' sel';if(i==ks)c+=' chk';
  if(targets.includes(i))c+=p?' tc':' t';e.className=c;if(p)e.innerHTML='<span class="'+p[0]+'">'+GL[p[1]]+'\uFE0E</span>';e.onclick=()=>click(i);B.appendChild(e)}
 let t;if(G.over)t=({'1-0':'White wins','0-1':'Black wins','1/2-1/2':'Draw'})[G.over.r]+' — '+G.over.why;
 else t=busy?'Auro is thinking…':(G.s.t==G.human?(inChk(G.s)?'Check! Your move':'Your move'):'Waiting…');
 $('status').textContent=t;let h='';for(let i=0;i<G.san.length;i+=2)h+='<b>'+(i/2+1)+'.</b> '+G.san[i]+' '+(G.san[i+1]||'')+'  ';$('moves').innerHTML=h||'—';$('moves').scrollTop=1e5;drawBars()}
$('bNew').onclick=newGame;$('bFlip').onclick=()=>{flip=!flip;render()};
$('bUndo').onclick=()=>{if(!G||busy||G.over)return;const n=G.s.t==G.human?2:1;if(G.san.length<n)return;for(let k=0;k<n;k++){G.san.pop();G.uci.pop();G.states.pop()}G.s=G.states[G.states.length-1];G.last=null;if(G.tc)G.tick=Date.now();sel=null;render()};
$('bRes').onclick=()=>{if(!G||G.over||!G.san.length)return;G.over={r:G.human=='w'?'0-1':'1-0',why:'Resignation'};save();render();show('Ana',G.id)};
/* Clock */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function spend(){if(!G.tc)return true;const now=Date.now(),c=G.s.t;G.clk[c]-=now-G.tick;if(G.clk[c]<=0){G.clk[c]=0;flag(c);return false}G.clk[c]+=G.inc*1000;G.tick=now;return true}
function flag(c){if(G.over)return;G.over={r:c=='w'?'0-1':'1-0',why:'Time out'};save();render()}
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return(ms/60|0)+':'+String(ms%60).padStart(2,'0')};
function drawBars(){const hu=G?G.human:'w',bot=flip?'b':'w',top=flip?'w':'b';
 const lab=c=>c==hu?'👤 '+esc(G?G.name:($('pname').value||'You')):'Auro AI'+(G?' <span class="mut">('+LN[G.lvl]+')</span>':'');
 const cl=c=>{if(!G||!G.tc)return'<span class="clk">∞</span>';let ms=G.clk[c];const act=!G.over&&G.s.t==c;if(act)ms-=Date.now()-G.tick;return'<span class="clk'+(act?' act':'')+(ms<10000?' low':'')+'">'+fmt(ms)+'</span>'};
 $('bTop').innerHTML='<span>'+lab(top)+'</span>'+cl(top);$('bBot').innerHTML='<span>'+lab(bot)+'</span>'+cl(bot)}
setInterval(()=>{if(!G||G.over)return;if(G.tc){const c=G.s.t;if(G.clk[c]-(Date.now()-G.tick)<=0){G.clk[c]=0;flag(c);return}}drawBars()},250);
try{$('pname').value=localStorage.getItem('auro_chess_name')||''}catch(e){}
/* Storage */
const KEY='auro_chess_games_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return MEM}}let MEM=[];
function store(a){MEM=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function save(){G.id=Date.now();const a=load();a.push({id:G.id,date:new Date().toLocaleString(),name:G.name,tcl:G.tcl,human:G.human,lvl:G.lvl,r:G.over.r,why:G.over.why,san:G.san,uci:G.uci});store(a);setTimeout(()=>show('Ana',G.id),700)}
const res=g=>g.r=='1/2-1/2'?'D':((g.r=='1-0')==(g.human=='w')?'W':'L'),resT={W:'Win',L:'Loss',D:'Draw'};
/* Tabs */
function show(t,id){for(const x of['Play','Hist','Ana']){$('p'+x).classList.toggle('hide',x!=t);$('t'+x).classList.toggle('on',x==t)}
 if(t=='Hist')hist();if(t=='Ana')ana(id)}
$('tPlay').onclick=()=>show('Play');$('tHist').onclick=()=>show('Hist');$('tAna').onclick=()=>show('Ana');
function hist(){const a=load().slice().reverse(),P=$('pHist');
 let w=a.filter(g=>res(g)=='W').length,l=a.filter(g=>res(g)=='L').length,d=a.length-w-l;
 P.innerHTML='<div class="card"><h3 style="margin:0 0 8px;color:var(--gold)">Game history</h3><div class="grid"><div><div class="big">'+a.length+'</div><span class="mut">Games</span></div><div><div class="big">'+w+'</div><span class="mut">Wins</span></div><div><div class="big">'+d+'</div><span class="mut">Draws</span></div><div><div class="big">'+l+'</div><span class="mut">Losses</span></div></div></div>'+
 (a.length?'<div class="card overflow" style="margin-top:12px"><table><tr><th>Player</th><th>Level</th><th>Opening</th><th>Moves</th><th>Result</th><th></th></tr>'+a.map(g=>'<tr><td>'+esc(g.name||'You')+'<br><span class="mut">'+g.date+'</span></td><td>'+LN[g.lvl]+'</td><td>'+opening(g.uci)+'</td><td>'+Math.ceil(g.san.length/2)+'</td><td class="'+res(g)+'">'+resT[res(g)]+' · '+g.why+'</td><td><button data-a="'+g.id+'">Report</button> <button data-x="'+g.id+'">✕</button></td></tr>').join('')+'</table></div><p><button id="clr">Clear all history</button></p>':'<p class="mut">No games yet. Finish a game to see it here.</p>');
 P.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>show('Ana',+b.dataset.a));
 P.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{store(load().filter(g=>g.id!=b.dataset.x));hist()});
 const c=$('clr');if(c)c.onclick=()=>{store([]);hist()}}
/* Analysis */
const CACHE={};
function replay(g){let s=init();const st=[s];for(const u of g.uci){s=make(s,legal(s).find(x=>uci(x)==u));st.push(s)}return st}
function ana(id){const P=$('pAna'),a=load();const g=a.find(x=>x.id==id)||a[a.length-1];
 if(!g){P.innerHTML='<p class="mut">No finished games yet. Play a game to get an analysis report.</p>';return}
 if(CACHE[g.id]){P.innerHTML=rep(g,CACHE[g.id]);wire(g);return}
 P.innerHTML='<div class="card"><div id="prog">Analysing game…</div></div>';
 const st=replay(g),e=[];let i=0;
 (function step(){const t0=Date.now();while(i<st.length&&Date.now()-t0<80){const v=srch(st[i],2,-1e5,1e5,0)*(st[i].t=='w'?1:-1);e.push(Math.max(-1000,Math.min(1000,v)));i++}
  const pr=$('prog');if(pr)pr.textContent='Analysing game… '+Math.round(i/st.length*100)+'%';
  if(i<st.length)setTimeout(step,0);else{CACHE[g.id]=build(g,st,e);P.innerHTML=rep(g,CACHE[g.id]);wire(g)}})()}
function build(g,st,e){const rows=[],C={w:{Book:0,Best:0,Good:0,Inaccuracy:0,Mistake:0,Blunder:0},b:{Book:0,Best:0,Good:0,Inaccuracy:0,Mistake:0,Blunder:0}},L={w:[],b:[]};
 g.uci.forEach((u,i)=>{const w=i%2==0;let loss=Math.max(0,w?e[i]-e[i+1]:e[i+1]-e[i]);let c=i<6?'Book':loss<=15?'Best':loss<=50?'Good':loss<=120?'Inaccuracy':loss<=250?'Mistake':'Blunder';
  if(i<6)loss=0;rows.push({i,san:g.san[i],loss,c,w});C[w?'w':'b'][c]++;L[w?'w':'b'].push(loss)});
 const acc=k=>L[k].length?Math.round(100*Math.exp(-(L[k].reduce((a,b)=>a+b,0)/L[k].length)/200)):0;
 const mo=rows.filter(r=>r.loss>=120).sort((a,b)=>b.loss-a.loss).slice(0,3).map(r=>{const s=st[r.i],bm=best(s,2,0);return{...r,alt:bm?san(s,bm,legal(s)):'—'}});
 const mat=st[st.length-1].b.reduce((a,p)=>p?a+(p[0]=='w'?1:-1)*V[p[1]]:a,0);
 return{rows,C,acc:{w:acc('w'),b:acc('b')},mo,e,mat,op:opening(g.uci)}}
function rep(g,R){const me=g.human,op=me=='w'?'b':'w',n=Math.ceil(g.san.length/2),r=res(g);
 const W=600,H=140,pts=R.e.map((v,i)=>(i/(Math.max(1,R.e.length-1))*W).toFixed(1)+','+(H/2-Math.max(-600,Math.min(600,v))/600*(H/2-6)).toFixed(1)).join(' ');
 const myA=R.acc[me],opA=R.acc[op],cl=R.C[me];
 let sum='You '+(r=='W'?'won':r=='L'?'lost':'drew')+' this '+n+'-move game ('+g.why.toLowerCase()+') against the '+LN[g.lvl]+' engine in a '+R.op+'. ';
 sum+=myA>=opA?'Your accuracy ('+myA+'%) was ahead of Auro\'s ('+opA+'%). ':'Auro was more accurate ('+opA+'% vs your '+myA+'%). ';
 if(R.mo.length){const t=R.mo.find(x=>x.w==(me=='w'));sum+=t?'Your costliest moment was move '+(Math.floor(t.i/2)+1)+(t.w?'':'…')+' ('+t.san+', about '+(t.loss/100).toFixed(1)+' pawns lost).':'Auro\'s main slip came with '+R.mo[0].san+'.'}else sum+='No major swings — a clean game from both sides.';
 const tip=cl.Blunder>1?'Focus: before each move, check what the opponent\'s last move attacks, and look for hanging pieces.':cl.Mistake+cl.Inaccuracy>3?'Focus: slow down in the middlegame and compare two candidate moves before committing.':'Focus: keep sharpening endgame technique and converting small advantages.';
 const catCol={Book:'#8b949e',Best:'#3fb950',Good:'#7ee787',Inaccuracy:'#d4a84b',Mistake:'#f0883e',Blunder:'#f85149'};
 return '<div class="card"><h3 style="margin:0 0 4px;color:var(--gold)">Analysis report</h3><div class="mut">'+g.date+' · '+LN[g.lvl]+(g.tcl?' · '+g.tcl:'')+' · '+esc(g.name||'You')+' played '+(me=='w'?'White':'Black')+' · <span class="'+r+'">'+resT[r]+'</span></div><p>'+sum+'</p></div>'+
 '<div class="grid" style="margin:12px 0"><div class="card"><div class="big">'+myA+'%</div><span class="mut">Your accuracy</span></div><div class="card"><div class="big">'+opA+'%</div><span class="mut">Auro accuracy</span></div><div class="card"><div class="big">'+n+'</div><span class="mut">Moves</span></div><div class="card"><div class="big">'+(R.mat>0?'+':'')+(R.mat/100)+'</div><span class="mut">Final material (White)</span></div></div>'+
 '<div class="card overflow"><div class="mut">Evaluation (up = White better)</div><svg viewBox="0 0 '+W+' '+H+'" width="100%"><line x1="0" x2="'+W+'" y1="'+H/2+'" y2="'+H/2+'" stroke="#2a313c"/><polyline points="'+pts+'" fill="none" stroke="#d4a84b" stroke-width="2"/></svg></div>'+
 '<div class="card overflow" style="margin-top:12px"><table><tr><th>Move quality</th><th>You</th><th>Auro</th></tr>'+Object.keys(cl).map(k=>'<tr><td style="color:'+catCol[k]+'">● '+k+'</td><td>'+R.C[me][k]+'</td><td>'+R.C[op][k]+'</td></tr>').join('')+'</table></div>'+
 '<div class="card" style="margin-top:12px"><b>Key moments</b>'+(R.mo.length?R.mo.map(m=>'<p style="margin:8px 0">Move '+(Math.floor(m.i/2)+1)+(m.w?'':'…')+' by '+(m.w==(me=='w')?'you':'Auro')+': <b>'+m.san+'</b> ('+m.c+', −'+(m.loss/100).toFixed(1)+'). Stronger was <b>'+m.alt+'</b>.</p>').join(''):'<p class="mut">No major turning points.</p>')+'<p class="mut">'+tip+'</p></div>'+
 '<div class="card" style="margin-top:12px"><b>Moves</b><p style="font-family:ui-monospace,monospace;font-size:13px">'+R.rows.map(x=>(x.w?(x.i/2+1)+'. ':'')+'<span style="color:'+catCol[x.c]+'">'+x.san+'</span>').join(' ')+'</p><div class="row"><button id="pgn">Copy PGN</button></div></div>'}
function wire(g){const b=$('pgn');if(b)b.onclick=()=>{let t='[Event "Auro AI Chess Master"]\n[White "'+(g.human=='w'?(g.name||'Player'):'Auro AI')+'"]\n[Black "'+(g.human=='b'?(g.name||'Player'):'Auro AI')+'"]\n[Result "'+g.r+'"]\n\n';g.san.forEach((s,i)=>{t+=(i%2?'':(i/2+1)+'. ')+s+' '});t+=g.r;try{navigator.clipboard.writeText(t);b.textContent='Copied ✓'}catch(e){b.textContent='Copy unavailable'}}}
render();
</script></body></html>
